name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app-bauen
  cancel-in-progress: true

jobs:
  build:
    name: Android-App & PC-Version bauen
    runs-on: ubuntu-24.04
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pakete installieren
        run: npm install --no-audit --no-fund

      - name: Web-App bauen
        run: npm run build

      - name: PC-Version für GitHub Pages bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          chmod +x android/gradlew

      - name: Upload-Schlüssel laden
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Schlüssel gefunden – die App wird signiert."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein Upload-Schlüssel hinterlegt – es wird nur eine Test-Version gebaut."
          fi

      - name: App bauen (signiert, für Handy & Play Store)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: App bauen (Test-Version)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Dateien einsammeln
        run: |
          mkdir -p out
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/*.apk out/Arise.apk
            cp android/app/build/outputs/bundle/release/*.aab out/Arise-PlayStore.aab
          else
            cp android/app/build/outputs/apk/debug/*.apk out/Arise.apk
          fi
          ls -la out

      - name: Als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: Arise-App
          path: out/

      - name: Download-Seite (Release) aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            NOTES="Signierte Version. Arise.apk zum Installieren auf dem Handy, Arise-PlayStore.aab für den Google Play Store."
          else
            NOTES="Test-Version (noch ohne eigenen Upload-Schlüssel)."
          fi
          gh release create "$TAG" out/* --title "Arise $TAG" --notes "$NOTES" --latest

      - name: PC-Version auf GitHub Pages veröffentlichen
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
